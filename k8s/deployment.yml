apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-devops-app
  labels:
    app: java-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-devops-app
  template:
    metadata:
      labels:
        app: java-devops-app
    spec:
      containers:
        - name: java-devops-app
          image: ECR_REGISTRY_URI:IMAGE_TAG
          ports:
            - containerPort: 8080
